<p>feature works!</p>
<div class="card w-75" *ngFor="let feature of features">
  <div class="card-body">
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>
          <div [innerHTML]="feature.title" class="text-uppercase font-weight-bold my-3"></div> 
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div [innerHTML]="feature.field_description"></div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
