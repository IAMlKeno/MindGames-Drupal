<div class="idea-form-container">
  <app-idea-form [model]="modelToEdit" [isNew]="isNew"></app-idea-form>
</div>
<mat-slide-toggle>Toggle me!</mat-slide-toggle>

<div>
  <h1>Ideas</h1>
</div>
<div class="card w-75" *ngFor="let idea of ideas">
  <div class="idea-title card-title"><h1 [innerHTML]="idea.title"></h1></div>
  <div class="actions">
    {{idea.uuid}} // TODO: rmove this<br />
    <button type="button" (click)="deleteIdea(idea.uuid)">Delete Idea</button>
    <br />
    <button type="button" (click)="editIdea(idea)">Edit This Idea</button>
  </div>
  <div class="card-body">
    <div [innerHTML]="idea.field_description" class="idea-description"></div>
    <div class="idea-features">
      <app-feature [features]="idea.field_features"></app-feature>
      <hr />
    </div>
  </div>
</div>
